# Полный стек для нагрузочного тестирования.
#
# Запуск:   docker compose -f docker-compose.load-test.yml up -d
# Остановка: docker compose -f docker-compose.load-test.yml down -v
#
# Bot:          http://localhost:3000  — POST /telegram/webhook
# Prometheus:   http://localhost:9090
# Grafana:      http://localhost:3001  — admin / admin
# Pushgateway:  http://localhost:9091
# Kibana:       http://localhost:5601

name: money-tracker-load-test

services:

  # ── База данных ────────────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: money_tracker_docker_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec rails db:prepare
    environment: &bot_env
      RAILS_ENV: docker_test
      SECRET_KEY_BASE: docker_test_secret_key_base
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DOCKER_TEST_DB_NAME: money_tracker_docker_test
    depends_on:
      db:
        condition: service_healthy

  # ── Бот (Rails + Puma, webhook-режим) ─────────────────────────────────────

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec rails server -p 3000 -b 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      <<: *bot_env
    volumes:
      # Логи пишутся ботом сюда, Filebeat читает из этого же volume
      - bot_logs:/app/log
    depends_on:
      migrate:
        condition: service_completed_successfully
      pushgateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Метрики ────────────────────────────────────────────────────────────────

  pushgateway:
    image: prom/pushgateway:v1.8.0
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      bot:
        condition: service_healthy
      pushgateway:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      prometheus:
        condition: service_healthy

  # ── Логи ──────────────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Читаем логи из того же volume что и бот
      - bot_logs:/app/log:ro
      - filebeat_registry:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      bot:
        condition: service_healthy
    command: filebeat -e --strict.perms=false

volumes:
  postgres_data:
  bot_logs:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  filebeat_registry:
